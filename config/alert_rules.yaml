alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95_ms > 2000 for 5m
    type: symptom-based
    owner: Thái-V3
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: Thái-V3
    runbook: docs/alerts.md#alert-2
  - name: total_cost_spike
    severity: warning
    condition: total_cost_usd > 2.5
    type: symptom-based
    owner: Thái-V3
    runbook: docs/alerts.md#alert-3

