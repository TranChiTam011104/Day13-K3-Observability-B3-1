alerts:
  - name: LatencyP95Exceeded
    severity: critical
    condition: latency_p95_ms > 3000 for 1m
    type: symptom-based
    owner: Thai-V3
    runbook: docs/alerts.md#alert-1
  - name: ErrorRateHigh
    severity: warning
    condition: error_rate_pct > 2 for 2m
    type: symptom-based
    owner: Thai-V3
    runbook: docs/alerts.md#alert-2
  - name: CostSpikeAlert
    severity: warning
    condition: total_cost_usd > 2.5 for 5m
    type: symptom-based
    owner: Thai-V3
    runbook: docs/alerts.md#alert-3
